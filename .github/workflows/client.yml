
name: client-application-workflow

on:
  push:
    branches:
      - master
    paths:
      - 'Front/my-app/**'
      - '.github/workflows/client.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: Front/my-app/package-lock.json

      - name: Install dependencies
        working-directory: ./Front/my-app
        run: npm ci

      - name: Build client
        working-directory: ./Front/my-app
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: ./Front/my-app
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/client:latest
            ${{ secrets.DOCKER_USERNAME }}/client:${{ github.sha }}
