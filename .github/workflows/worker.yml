name: worker-application-workflow

on:
  push:
    branches:
      - master
    paths:
      - 'WorkerApp/**'
      - '.github/workflows/worker.yml'


jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      
      - name: set up maven 
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      
      - name: build and test worker
        working-directory: ./WorkerApp
        run: mvn clean compile -D skipTests=true
      
      - name: login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: ./WorkerApp
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/worker:latest
            ${{ secrets.DOCKER_USERNAME }}/worker:${{ github.sha }}